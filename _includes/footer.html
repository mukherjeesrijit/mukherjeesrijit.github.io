<footer class="foot">
  <div class="foot-in">
    <a class="foot-mail" href="mailto:{{ site.email }}">{{ site.email }}</a>
    <nav class="foot-links" aria-label="Elsewhere">
      {%- for l in site.links %}
      <a href="{{ l.link }}" target="_blank" rel="noopener">{{ l.name }}</a>
      {%- endfor %}
    </nav>
    <p class="fine">© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </div>
</footer>
