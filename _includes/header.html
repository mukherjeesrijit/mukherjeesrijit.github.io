{%- assign listed = site.posts | where_exp: "p", "p.list != false" -%}
<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}">Srijit Mukherjee<i>.</i></a>
  <nav class="nav" aria-label="Main">
    {%- for item in site.nav %}
    <a href="{{ item.link | relative_url }}"{% if page.url == item.link %} aria-current="page"{% endif %}>{{ item.name }}</a>
    {%- endfor %}
    {%- if listed.size > 0 %}
    <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>Blog</a>
    {%- endif %}
  </nav>
  <details class="menu">
    <summary aria-label="Menu">☰</summary>
    <nav class="menulist" aria-label="Main">
      {%- for item in site.nav %}
      <a href="{{ item.link | relative_url }}">{{ item.name }}</a>
      {%- endfor %}
      {%- if listed.size > 0 %}<a href="{{ '/blog/' | relative_url }}">Blog</a>{% endif %}
    </nav>
  </details>
</header>
