exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - notebooks/
  - scripts/
  - README.md
  - CHANGELOG.md
  - LICENSE.md
