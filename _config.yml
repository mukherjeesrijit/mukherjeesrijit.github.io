title: Srijit Mukherjee
description: "PhD candidate at Penn State building disease-informed, interpretable machine learning for biomedical image analysis."
baseurl: ""
url: "https://srijitmukherjee.com"
og_image: /assets/img/profile-pic.png
google_analytics: "G-GT7M9B1WK5"

email: szm6596@psu.edu
cv: "/assets/Curriculum Vitae Srijit Mukherjee.pdf"

# Top menu. "Blog" is added by itself once a post is published (and its `list` is not false).
nav:
  - name: Publications
    link: /publications/
  - name: Teaching
    link: /teaching/
  - name: CV
    link: "/assets/Curriculum Vitae Srijit Mukherjee.pdf"

# Footer links
links:
  - name: Google Scholar
    link: https://scholar.google.com/citations?user=bmQgd0MAAAAJ&hl=en
  - name: GitHub
    link: https://github.com/mukherjeesrijit
  - name: LinkedIn
    link: https://www.linkedin.com/in/srijit-mukherjee/
