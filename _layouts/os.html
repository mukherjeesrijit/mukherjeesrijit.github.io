<!doctype html>
<html lang="en">
<head>
{% include head.html %}
<link rel="stylesheet" href="{{ '/assets/css/os.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="os" data-page="{{ page.os_page }}" data-v="{{ site.time | date: '%s' }}">
<header class="top">
  <a class="brand" href="/os/"><span class="brand-name">Srijit Mukherjee<i>.</i></span> <span class="os-tag">os</span></a>
  <nav class="nav os-nav" aria-label="OS">
    <a href="/os/strategy/"{% if page.os_page == "strategy" %} aria-current="page"{% endif %}>Strategy</a>
    <a href="/os/projects/"{% if page.os_page == "projects" %} aria-current="page"{% endif %}>Projects</a>
    <a href="/os/schedule/"{% if page.os_page == "schedule" %} aria-current="page"{% endif %}>Schedule</a>
  </nav>
</header>
<main class="wrap os-main">
  <div id="gate" hidden></div>
  <div id="app" hidden></div>
  <noscript><p>The OS needs JavaScript.</p></noscript>
</main>
<script type="module" src="{{ '/assets/js/os.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
